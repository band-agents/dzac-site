<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<meta name="theme-color" content="#070D1B">
<title>DZAC 5 · Three directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,200..500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Geist:wght@200..500&family=IBM+Plex+Sans+Arabic:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/dz.css">
<style>
/* The board Dan opens first: the three directions side by side, each card
   playing its own hero footage in its own type. */
:root { --bg: #070D1B; --fg: #EEF3FF; --mute: rgba(238, 243, 255, .6); --edge: rgba(255, 255, 255, .12); --pad: clamp(18px, 4vw, 56px); }
body { background: var(--bg); color: var(--fg); font-family: "Geist", system-ui, sans-serif; font-weight: 300; min-height: 100svh; }
html[lang="ar"] body { font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; }
.top { display: flex; justify-content: space-between; align-items: center; padding: 24px var(--pad); }
.top b { font-weight: 500; letter-spacing: -.02em; font-size: 18px; direction: ltr; }
.top b span { color: #3ED1F2; }
.lang { height: 40px; min-width: 50px; padding-inline: 14px; border-radius: 999px; border: 1px solid var(--edge); display: grid; place-items: center; font-size: 13px; }
.head { padding: clamp(20px, 5vw, 70px) var(--pad) clamp(26px, 3vw, 44px); display: grid; gap: 14px; max-width: 1500px; margin-inline: auto; }
.head p:first-child { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #3ED1F2; }
html[lang="ar"] .head p:first-child { letter-spacing: 0; font-size: 14px; }
.head h1 { font-weight: 200; font-size: clamp(40px, 6vw, 92px); line-height: 1; letter-spacing: -.045em; }
html[lang="ar"] .head h1 { letter-spacing: 0; line-height: 1.3; }
.head p:last-child { color: var(--mute); max-width: 60ch; font-size: 16px; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 0 var(--pad) var(--pad); max-width: 1500px; margin-inline: auto; }
.card { position: relative; min-height: min(78svh, 760px); border-radius: 26px; overflow: hidden; isolation: isolate; display: flex; flex-direction: column; justify-content: space-between; padding: 26px; border: 1px solid var(--edge); transition: transform .6s cubic-bezier(.2, .8, .2, 1), border-color .4s; }
.card:hover { transform: translateY(-6px); border-color: rgba(255, 255, 255, .35); }
.card .vw { position: absolute; inset: 0; z-index: -2; }
.card .vw video, .card .vw img { transition: scale 1.4s cubic-bezier(.2, .8, .2, 1); }
.card:hover .vw video, .card:hover .vw img { scale: 1.05; }
.card::after { content: ""; position: absolute; inset: 0; z-index: -1; }
.card .k { display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
html[lang="ar"] .card .k { letter-spacing: 0; font-size: 14px; }
.card .k i { font-style: normal; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; }
.card h2 { font-weight: 400; line-height: .95; margin-bottom: 14px; }
.card p { font-size: 15px; line-height: 1.5; max-width: 38ch; }
.card ul { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.card li { font-size: 12px; padding: 6px 11px; border-radius: 999px; }
.card .go { margin-top: 22px; display: inline-flex; align-items: center; gap: 10px; height: 48px; padding-inline: 22px; border-radius: 999px; font-size: 14px; font-weight: 500; }
[dir="rtl"] .card .go span { display: inline-block; scale: -1 1; }

/* A · Pulse: white and electric blue, wide light type */
.a { background: #fff; color: #061033; }
.a::after { background: linear-gradient(180deg, rgba(255, 255, 255, .92) 0%, rgba(255, 255, 255, .2) 30%, rgba(6, 86, 212, .2) 55%, rgba(6, 16, 51, .92)); }
.a .k i { background: #0656D4; color: #fff; }
.a h2 { font-family: "Archivo", sans-serif; font-variation-settings: "wdth" 125; font-weight: 300; font-size: clamp(44px, 4.6vw, 76px); letter-spacing: -.04em; color: #fff; }
.a p { color: rgba(255, 255, 255, .85); }
.a li { background: rgba(255, 255, 255, .16); color: #fff; }
.a .go { background: #0656D4; color: #fff; }
/* B · Premiere: black and gold, Bodoni */
.b { background: #050505; color: #F4EEE2; }
.b::after { background: linear-gradient(180deg, rgba(5, 5, 5, .6), rgba(5, 5, 5, .1) 35%, rgba(5, 5, 5, .95) 75%); }
.b .k { color: #D4AF6A; }
.b .k i { border: 1px solid #D4AF6A; font-family: "Bodoni Moda", serif; font-style: italic; }
.b h2 { font-family: "Bodoni Moda", serif; font-size: clamp(50px, 5vw, 84px); letter-spacing: -.01em; }
.b h2 em { background: linear-gradient(100deg, #F6E4B5, #D4AF6A 45%, #9C7A3C); -webkit-background-clip: text; background-clip: text; color: transparent; }
.b p { color: rgba(244, 238, 226, .75); }
.b li { border: 1px solid rgba(212, 175, 106, .35); color: #F1DDAE; }
.b .go { background: linear-gradient(100deg, #F1DDAE, #D4AF6A 55%, #B48A45); color: #140F05; border-radius: 0; letter-spacing: .18em; text-transform: uppercase; font-size: 12px; }
html[lang="ar"] .b .go { letter-spacing: 0; font-size: 14px; }
/* C · Atlas: glass on a blue mesh */
.c { background: radial-gradient(80% 60% at 20% 10%, #0656D4, transparent 60%), radial-gradient(60% 50% at 90% 90%, rgba(62, 209, 242, .5), transparent 60%), #030A1F; color: #EEF3FF; }
.c::after { background: linear-gradient(180deg, rgba(3, 10, 31, .2), rgba(3, 10, 31, .85) 75%); }
.c .vw { inset: 70px 22px auto; height: 46%; border-radius: 20px; overflow: hidden; border: 1px solid rgba(255, 255, 255, .15); }
.c .k i { background: rgba(255, 255, 255, .12); border: 1px solid var(--edge); }
.c h2 { font-family: "Geist", sans-serif; font-weight: 200; font-size: clamp(48px, 4.8vw, 80px); letter-spacing: -.05em; }
.c p { color: rgba(222, 232, 255, .72); }
.c li { background: rgba(255, 255, 255, .08); border: 1px solid var(--edge); }
.c .go { background: #fff; color: #061033; }
html[lang="ar"] .card h2 { font-family: "IBM Plex Sans Arabic", sans-serif; letter-spacing: 0; line-height: 1.2; font-variation-settings: normal; }
.foot { padding: 0 var(--pad) 40px; max-width: 1500px; margin-inline: auto; color: var(--mute); font-size: 13px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.foot a { color: #3ED1F2; }

@media (max-width: 1000px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .card { min-height: 80svh; }
}
</style>
</head>
<body>
<header class="top"><b>DZAC<span>5</span></b><a href="#" class="lang" id="lang"></a></header>
<main id="app"></main>
<script>
(function () {
  const qs = new URLSearchParams(location.search);
  let lang = qs.get("lang") || (() => { try { return localStorage.getItem("dz.lang"); } catch { return null; } })() || "en";
  if (lang !== "ar") lang = "en";
  const T = (en, ar) => (lang === "ar" ? ar : en);
  const D = [
    { k: "a", n: "A", name: T("Pulse", "النبض"), title: T("Pulse", "النبض"),
      p: T("The DZAC 4 stage's electric blue on white. The DZAC 5 letters are windows onto the film, and scrolling flies the camera through them into the room.",
           "أزرق مسرح DZAC 4 على الأبيض. حروف DZAC 5 نوافذ على الفيلم، ومع التمرير تعبر الكاميرا من خلالها إلى القاعة."),
      tags: [T("Fly-through hero", "افتتاحية تعبر الحروف"), T("Expanding programme", "برنامج يتمدد"), T("Light, wide type", "خط عريض خفيف")],
      v: "media/montage-h.mp4", vm: "media/montage-v.mp4", poster: "media/montage-h.webp" },
    { k: "b", n: "B", name: T("Premiere", "العرض الأول"), title: T("Premi<em>ere</em>", "العرض <em>الأول</em>"),
      p: T("The conference told as a film. Black and gold, every section a full-screen chapter with its own footage, and on phones you swipe through it like stories. Passes are cinema tickets.",
           "المؤتمر كفيلم. أسود وذهبي، كل قسم فصل بملء الشاشة بلقطاته الخاصة، وعلى الموبايل تتصفحه كالستوريز. والباقات تذاكر سينما."),
      tags: [T("Chapters + rail", "فصول ومؤشر"), T("Ticket passes", "باقات كتذاكر"), T("Bodoni + gold", "بودوني وذهبي")],
      v: "../media/video/masterclass-film.mp4", vm: "media/v-m2-or.mp4", poster: "../media/posters/masterclass-film.webp" },
    { k: "c", n: "C", name: T("Atlas", "أطلس"), title: T("Atlas", "أطلس"),
      p: T("One calm control surface. Glass tiles on a slow blue mesh answer when, where and what at a glance; the programme filters and searches; a pass finder answers in two taps; phones get a tab bar.",
           "لوحة واحدة هادئة. بطاقات زجاجية على خلفية زرقاء متحركة تجيب متى وأين وماذا من أول نظرة؛ برنامج بفلترة وبحث؛ ومساعد يختار باقتك في نقرتين؛ وشريط تبويب على الموبايل."),
      tags: [T("Bento hero", "واجهة بنتو"), T("Search the programme", "بحث في البرنامج"), T("Pass finder", "مساعد اختيار الباقة")],
      v: "../media/loops/review.mp4", vm: "../media/loops/review.mp4", poster: "../media/loops/review.webp" },
  ];
  function render() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.getElementById("lang").textContent = lang === "ar" ? "EN" : "عربي";
    const narrow = matchMedia("(max-width: 760px)").matches;
    document.getElementById("app").innerHTML = `
      <section class="head"><p>${T("DZAC 5 · Website directions", "DZAC 5 · اتجاهات الموقع")}</p><h1>${T("Three ways to tell it", "ثلاث طرق لنحكيها")}</h1>
        <p>${T("Same content, same films, three very different sites. Open each one, scroll it on a phone too, and pick the one that feels like DZAC 5. Each works in English and Arabic.",
               "المحتوى نفسه والأفلام نفسها، وثلاثة مواقع مختلفة تمامًا. افتح كل واحد، وجرّبه على الموبايل أيضًا، واختر الأقرب لروح DZAC 5. كلها بالعربي والإنجليزي.")}</p></section>
      <section class="grid">${D.map((d) => `<a class="card ${d.k}" href="${d.k}/?lang=${lang}">
        <div class="vw"><video data-src="${narrow ? d.vm : d.v}" poster="${d.poster}" muted loop playsinline preload="none"></video></div>
        <div class="k"><span>${T("Direction", "الاتجاه")} ${d.n}</span><i>${d.n}</i></div>
        <div><h2>${d.title}</h2><p>${d.p}</p><ul>${d.tags.map((x) => `<li>${x}</li>`).join("")}</ul><span class="go">${T("Open", "افتح")} ${d.name} <span>→</span></span></div></a>`).join("")}</section>
      <footer class="foot"><span>${T("Previews only: registration and apply links go to the current site.", "معاينات فقط: روابط التسجيل والتقديم تذهب إلى الموقع الحالي.")}</span><a href="../${lang}/">${T("Current site", "الموقع الحالي")} →</a></footer>`;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const io = new IntersectionObserver((es) => es.forEach((e) => { const v = e.target; if (e.isIntersecting) { if (!v.src) v.src = v.dataset.src; v.play().catch(() => {}); } else v.pause(); }));
    if (!reduce) document.querySelectorAll("video[data-src]").forEach((v) => io.observe(v));
  }
  document.getElementById("lang").onclick = (e) => { e.preventDefault(); lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("dz.lang", lang); } catch {} const u = new URL(location.href); u.searchParams.set("lang", lang); history.replaceState(null, "", u); render(); };
  render();
})();
</script>
</body>
</html>
