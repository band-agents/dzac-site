<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<meta name="theme-color" content="#0656D4">
<title>DZAC 5 · Direction A · Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,200..600&family=Readex+Pro:wght@200..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/dz.css">
<style>
/* ═══ A · PULSE ═══════════════════════════════════════════
   The DZAC 4 stage's electric blue and white. Type is light and very wide
   (Archivo at its expanded widths, never bold); Arabic in Readex Pro. The
   hero's letters are windows onto the DZAC 4 film, and scrolling flies the
   camera through them until the film fills the screen. */
:root {
  --blue: #0656D4; --blue2: #0872F5; --cyan: #3ED1F2; --ice: #DCEBFF; --ink: #061033; --ink2: #3B4A6B; --white: #FFFFFF; --mist: #F2F6FD; --line: rgba(6, 16, 51, .12);
  --f: "Archivo", system-ui, sans-serif; --fa: "Readex Pro", system-ui, sans-serif;
  --pad: clamp(20px, 4.5vw, 64px); --ease: cubic-bezier(.2, .8, .2, 1);
}
html[lang="ar"] { --f: "Readex Pro", system-ui, sans-serif; }
body { font-family: var(--f); font-weight: 300; color: var(--ink); background: var(--white); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 1440px; margin-inline: auto; padding-inline: var(--pad); }
.wide { font-variation-settings: "wdth" 125; }
html[lang="ar"] .wide { font-variation-settings: normal; }
.k { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; font-weight: 500; color: var(--blue); font-variation-settings: "wdth" 110; }
html[lang="ar"] .k { letter-spacing: 0; font-size: 14px; }
.big { font-weight: 300; font-size: clamp(44px, 7vw, 116px); line-height: .92; letter-spacing: -.035em; font-variation-settings: "wdth" 112; }
html[lang="ar"] .big { letter-spacing: 0; line-height: 1.25; font-size: clamp(36px, 5.6vw, 84px); }
.btn { display: inline-flex; align-items: center; gap: 12px; height: 56px; padding-inline: 28px; border-radius: 999px; font-weight: 500; font-size: 15px; transition: transform .4s var(--ease), background-color .3s, color .3s, box-shadow .4s; white-space: nowrap; }
.btn-b { background: var(--blue); color: #fff; box-shadow: 0 16px 40px -18px rgba(6, 86, 212, .8); }
.btn-b:hover { background: var(--ink); transform: translateY(-2px); }
.btn-w { background: #fff; color: var(--blue); }
.btn-w:hover { background: var(--cyan); color: var(--ink); }
.btn-o { border: 1.5px solid currentColor; }
.btn-o:hover { background: currentColor; }
.btn-o:hover span { color: var(--white); filter: invert(0); }
.arr { display: inline-block; transition: transform .4s var(--ease); }
.btn:hover .arr { transform: translateX(5px); }
[dir="rtl"] .arr { transform: scaleX(-1); }
[dir="rtl"] .btn:hover .arr { transform: scaleX(-1) translateX(5px); }

/* Header */
.hd { position: fixed; z-index: 50; inset-inline: 0; top: 0; height: 70px; display: flex; align-items: center; justify-content: space-between; padding-inline: var(--pad); transition: background-color .4s, box-shadow .4s; }
.hd.solid { background: rgba(255, 255, 255, .86); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 1px 0 var(--line); }
.logo { display: flex; align-items: baseline; gap: 2px; font-weight: 500; font-size: 22px; letter-spacing: -.02em; font-variation-settings: "wdth" 125; color: var(--ink); direction: ltr; }
.logo b { color: var(--blue); font-weight: 500; }
.nav { display: flex; gap: 28px; font-size: 14px; font-weight: 400; }
.nav a { position: relative; padding-block: 4px; }
.nav a::after { content: ""; position: absolute; inset-inline: 0; bottom: 0; height: 2px; background: var(--blue); scale: 0 1; transform-origin: left; transition: scale .4s var(--ease); }
.nav a:hover::after { scale: 1 1; }
.hd-r { display: flex; align-items: center; gap: 10px; }
.lang { height: 40px; min-width: 46px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; display: grid; place-items: center; padding-inline: 12px; }
.hd .btn { height: 42px; padding-inline: 20px; font-size: 14px; }
@media (max-width: 1000px) { .nav { display: none; } }

/* Hero: a tall stage; the letters fly open as you scroll */
.hero { position: relative; height: 230svh; }
.stage { position: sticky; top: 0; height: 100svh; overflow: hidden; background: var(--white); }
.stage video, .stage .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.mask { position: absolute; inset: 0; background: #fff; mix-blend-mode: screen; display: grid; place-items: center;
  transform-origin: var(--ox, 63%) 47%; scale: calc(1 + var(--p, 0) * var(--p, 0) * 30); opacity: clamp(0, calc(1 - (var(--p, 0) - .5) * 3.2), 1); will-change: scale, opacity; }
.mask-word { font-weight: 600; color: #000; font-size: clamp(60px, 23.5vw, 430px); line-height: .78; letter-spacing: -.06em; font-variation-settings: "wdth" 125; direction: ltr; translate: 0 -4%; white-space: nowrap; }
.hero-ui { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 96px var(--pad) clamp(24px, 4vh, 44px); pointer-events: none; opacity: calc(1 - var(--p, 0) * 3.2); }
.hero-ui > * { pointer-events: auto; }
.hero-top { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 10px; height: 36px; padding-inline: 16px; border-radius: 999px; background: var(--mist); font-size: 13px; font-weight: 400; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.hero-bot { display: grid; grid-template-columns: minmax(0, 1.2fr) auto; gap: 28px; align-items: end; }
.tag { font-size: clamp(26px, 3.4vw, 50px); line-height: 1.05; letter-spacing: -.02em; max-width: 15ch; font-variation-settings: "wdth" 100; }
html[lang="ar"] .tag { line-height: 1.4; letter-spacing: 0; }
.hero-meta { display: flex; gap: 24px; flex-wrap: wrap; font-size: 14px; color: var(--ink2); margin-top: 14px; }
.cd { display: flex; gap: 10px; direction: ltr; }
.cd > div { min-width: 74px; padding: 12px 10px 10px; border-radius: 16px; background: var(--blue); color: #fff; text-align: center; }
.cd b { display: block; font-weight: 400; font-size: 32px; line-height: 1; font-variation-settings: "wdth" 110; font-variant-numeric: tabular-nums; }
.cd small { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.film-cap { position: absolute; inset-inline: var(--pad); bottom: 40px; color: #fff; display: flex; justify-content: space-between; align-items: end; gap: 20px; opacity: calc((var(--p, 0) - .62) * 4); pointer-events: none; }
.film-cap .big { color: #fff; max-width: 12ch; }
.scrim { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(6, 16, 51, .72)); opacity: calc((var(--p, 0) - .55) * 3); pointer-events: none; }

/* Ticker */
.tick { background: var(--blue); color: #fff; overflow: hidden; padding-block: 22px; direction: ltr; }
.tick-t { display: flex; width: max-content; animation: tk 50s linear infinite; }
.tick-t span { font-size: clamp(22px, 2.6vw, 38px); font-variation-settings: "wdth" 120; padding-inline: 22px; white-space: nowrap; display: inline-flex; align-items: center; gap: 44px; }
.tick-t i { width: 10px; height: 10px; border-radius: 50%; background: var(--cyan); }
@keyframes tk { to { transform: translateX(-50%); } }

/* Sections */
.sec { padding-block: clamp(80px, 10vw, 150px); }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: clamp(36px, 5vw, 64px); }
.head .k { margin-bottom: 16px; display: block; }

/* Intro */
.intro p.big { font-size: clamp(32px, 4.6vw, 72px); line-height: 1.04; max-width: 22ch; }
html[lang="ar"] .intro p.big { font-size: clamp(26px, 3.4vw, 50px); line-height: 1.55; }
.intro p.big em { font-style: normal; color: var(--blue); }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: clamp(48px, 6vw, 88px); border-top: 1.5px solid var(--ink); }
.fact { padding: 26px 20px 0 0; }
.fact + .fact { border-inline-start: 1px solid var(--line); padding-inline-start: 22px; }
.fact b { display: block; font-weight: 200; font-size: clamp(64px, 8vw, 128px); line-height: .9; letter-spacing: -.05em; color: var(--blue); font-variation-settings: "wdth" 125; }
.fact span { font-size: 14px; color: var(--ink2); }
@media (max-width: 760px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } .fact:nth-child(3) { border-inline-start: 0; padding-inline-start: 0; } .fact { padding-bottom: 22px; } }

/* What's new */
.news { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.nw { position: relative; padding: 28px 24px 30px; border-radius: 26px; background: var(--mist); min-height: 260px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; transition: background-color .5s var(--ease), color .5s; }
.nw::before { content: attr(data-n); font-weight: 200; font-size: 64px; line-height: 1; color: var(--blue); font-variation-settings: "wdth" 125; transition: color .5s; }
.nw h3 { font-weight: 400; font-size: 22px; line-height: 1.15; margin-top: auto; }
.nw p { font-size: 14.5px; color: var(--ink2); transition: color .5s; }
.nw:hover { background: var(--blue); color: #fff; }
.nw:hover::before { color: var(--cyan); }
.nw:hover p { color: rgba(255, 255, 255, .82); }
@media (max-width: 1000px) { .news { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Tracks: six columns that open */
.prog { background: var(--ink); color: #fff; }
.prog .k { color: var(--cyan); }
.cols { display: flex; gap: 10px; height: 620px; }
.col { position: relative; flex: 1 1 0; min-width: 0; border-radius: 26px; overflow: hidden; background: #0B1A47; cursor: pointer; transition: flex-grow .8s var(--ease); }
.col.on { flex-grow: 5.2; }
.col img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .35; filter: grayscale(1); transition: opacity .8s, filter .8s, scale 1.4s var(--ease); scale: 1.1; }
.col.on img { opacity: .55; filter: grayscale(0) saturate(1.1); scale: 1; }
.col::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6, 16, 51, .2), rgba(6, 16, 51, .92) 70%); }
.col-n { position: absolute; z-index: 2; top: 22px; inset-inline-start: 22px; font-weight: 200; font-size: 44px; line-height: 1; color: var(--cyan); font-variation-settings: "wdth" 125; }
.col-t { position: absolute; z-index: 2; bottom: 24px; inset-inline-start: 22px; inset-inline-end: 22px; font-size: 22px; line-height: 1.15; font-weight: 400; }
.col:not(.on) .col-t { writing-mode: vertical-rl; rotate: 180deg; bottom: 24px; inset-inline-end: auto; white-space: nowrap; font-size: 20px; }
[dir="rtl"] .col:not(.on) .col-t { rotate: 0deg; }
.col-s { position: absolute; z-index: 2; inset-inline: 22px; bottom: 76px; display: grid; gap: 10px; opacity: 0; translate: 0 20px; transition: opacity .5s .25s, translate .6s .25s var(--ease); }
.col.on .col-s { opacity: 1; translate: 0 0; }
.col:not(.on) .col-s { pointer-events: none; transition-delay: 0s; }
.col-s li { display: grid; gap: 2px; padding: 12px 14px; border-radius: 14px; background: rgba(255, 255, 255, .08); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 14px; line-height: 1.35; }
.col-s small { color: var(--cyan); font-size: 12px; }
@media (max-width: 1000px) {
  .cols { flex-direction: column; height: auto; }
  .col { min-height: 84px; flex: none; transition: min-height .7s var(--ease); }
  .col.on { min-height: 560px; }
  .col:not(.on) .col-t { writing-mode: horizontal-tb; rotate: 0deg; inset-inline-start: 84px; bottom: 28px; font-size: 19px; white-space: normal; }
  .col-n { top: 20px; font-size: 34px; }
}

/* Beyond */
.beyond { background: var(--blue); color: #fff; overflow: hidden; }
.beyond .k { color: var(--cyan); }
.bw { display: grid; gap: 0; }
.bw a { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; padding-block: 18px; border-top: 1px solid rgba(255, 255, 255, .25); }
.bw a:last-child { border-bottom: 1px solid rgba(255, 255, 255, .25); }
.bw strong { font-weight: 300; font-size: clamp(40px, 7vw, 112px); line-height: .95; letter-spacing: -.04em; font-variation-settings: "wdth" 125; color: transparent; -webkit-text-stroke: 1.2px rgba(255, 255, 255, .9); transition: color .5s var(--ease); }
html[lang="ar"] .bw strong { letter-spacing: 0; line-height: 1.3; font-size: clamp(34px, 5.6vw, 86px); }
.bw a:hover strong { color: #fff; }
.bw span { font-size: 14px; opacity: .8; max-width: 24ch; text-align: end; }

/* Masterclass */
.mc { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: clamp(28px, 5vw, 80px); align-items: center; }
.mc-v { position: relative; aspect-ratio: 4 / 5; border-radius: 34px; overflow: hidden; background: var(--ink); }
.live { position: absolute; z-index: 2; top: 18px; inset-inline-start: 18px; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding-inline: 14px; border-radius: 999px; background: #fff; color: var(--ink); font-size: 12px; font-weight: 500; letter-spacing: .12em; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: #E2354A; animation: blink 1.2s infinite; }
.mc-20 { display: flex; align-items: flex-end; gap: 18px; margin-block: 26px; }
.mc-20 b { font-weight: 200; font-size: clamp(130px, 16vw, 240px); line-height: .78; letter-spacing: -.06em; color: var(--blue); font-variation-settings: "wdth" 125; }
.mc-20 span { font-size: 18px; max-width: 12ch; padding-bottom: 12px; }
.mc ul { border-top: 1px solid var(--line); }
.mc li { padding-block: 14px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; }
.mc li::before { content: ""; width: 8px; height: 8px; margin-top: 8px; border-radius: 50%; background: var(--blue); flex-shrink: 0; }
.fee { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-top: 26px; }
.fee b { font-weight: 300; font-size: 40px; font-variation-settings: "wdth" 120; }
.fee small { display: block; font-size: 12px; color: var(--ink2); }
@media (max-width: 900px) { .mc { grid-template-columns: minmax(0, 1fr); } .mc-v { aspect-ratio: 1; } }

/* Review: full-bleed film */
.review { position: relative; height: 92svh; color: #fff; overflow: hidden; }
.review video, .review .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.review::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6, 16, 51, .15), rgba(6, 16, 51, .85)), linear-gradient(90deg, rgba(6, 86, 212, .5), transparent 60%); }
.review .wrap { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 48px; }
.review .k { color: var(--cyan); }
.rstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-top: 34px; border-top: 1px solid rgba(255, 255, 255, .3); }
.rstats div { padding-top: 18px; }
.rstats b { display: block; font-weight: 300; font-size: clamp(28px, 3vw, 44px); font-variation-settings: "wdth" 120; }
.rstats span { font-size: 13px; opacity: .8; }

/* Editions */
.eds { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.ed { padding: 26px 22px 30px; border-radius: 26px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; min-height: 290px; transition: transform .5s var(--ease); }
.ed:hover { transform: translateY(-6px); }
.ed b { font-weight: 200; font-size: 76px; line-height: .9; letter-spacing: -.05em; color: var(--blue); font-variation-settings: "wdth" 125; direction: ltr; text-align: start; }
.ed small { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); }
.ed strong { font-weight: 400; font-size: 17px; line-height: 1.3; margin-top: auto; }
.ed span { font-size: 14px; color: var(--ink2); }
.ed.now { background: var(--blue); color: #fff; border-color: var(--blue); }
.ed.now b { color: #fff; }
.ed.now small, .ed.now span { color: rgba(255, 255, 255, .8); }

/* Lounge */
.lounge { background: var(--mist); overflow: hidden; }
.reels { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px; }
.reel { position: relative; aspect-ratio: 9 / 16; border-radius: 22px; overflow: hidden; background: var(--ink); transition: transform .6s var(--ease); }
.reel:nth-child(even) { translate: 0 40px; }
.reel:hover { transform: scale(1.04); }
.reel .play { position: absolute; z-index: 2; inset-inline-end: 12px; bottom: 12px; width: 40px; height: 40px; border-radius: 50%; background: #fff; color: var(--blue); display: grid; place-items: center; font-size: 12px; }
.reel .ep { position: absolute; z-index: 2; top: 12px; inset-inline-start: 12px; font-size: 11px; padding: 5px 10px; border-radius: 999px; background: rgba(255, 255, 255, .92); color: var(--ink); direction: ltr; }

/* Faculty */
.fac { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.pr { display: grid; gap: 12px; }
.pr-ph { position: relative; aspect-ratio: 4 / 5; border-radius: 26px; overflow: hidden; background: linear-gradient(160deg, var(--ice), #BFD6FF); }
.pr-ph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; filter: grayscale(1) contrast(1.05); transition: filter .7s, scale 1.2s var(--ease); }
.pr-ph::after { content: ""; position: absolute; inset: 0; background: var(--blue); mix-blend-mode: screen; opacity: .45; transition: opacity .7s; }
.pr:hover .pr-ph img { filter: none; scale: 1.05; }
.pr:hover .pr-ph::after { opacity: 0; }
.pr-in { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 200; font-size: 110px; color: var(--blue); font-variation-settings: "wdth" 125; letter-spacing: -.05em; }
.pr small { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); font-weight: 500; }
.pr strong { font-weight: 400; font-size: 19px; line-height: 1.25; }
.past { margin-top: 44px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.past span { padding: 9px 16px; border-radius: 999px; background: var(--mist); font-size: 14px; }
.past em { font-style: normal; font-size: 13px; color: var(--ink2); margin-inline-end: 8px; }
.orgs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
.orgs div { padding: 22px; border-radius: 22px; border: 1px solid var(--line); display: grid; gap: 6px; }
.orgs small { font-size: 12px; color: var(--ink2); }
@media (max-width: 1000px) { .fac { grid-template-columns: repeat(2, minmax(0, 1fr)); } .orgs { grid-template-columns: minmax(0, 1fr); } }

/* Films */
.films { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.fl { display: grid; gap: 12px; text-align: start; }
.fl .vw { aspect-ratio: 16 / 10; border-radius: 22px; background: var(--ink); }
.fl .vw::after { content: "▶"; position: absolute; inset: 0; margin: auto; width: 58px; height: 58px; border-radius: 50%; background: #fff; color: var(--blue); display: grid; place-items: center; font-size: 15px; transition: scale .4s var(--ease); }
.fl:hover .vw::after { scale: 1.12; }
.fl small { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); font-weight: 500; }
.fl strong { font-weight: 400; font-size: 18px; }

/* Passes */
.passes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: stretch; }
.ps { padding: 32px 28px; border-radius: 30px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; transition: transform .5s var(--ease), box-shadow .5s; }
.ps:hover { transform: translateY(-8px); box-shadow: 0 40px 70px -40px rgba(6, 16, 51, .4); }
.ps small { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 500; color: var(--blue); }
.ps b { font-weight: 300; font-size: clamp(38px, 3.6vw, 54px); line-height: 1; letter-spacing: -.03em; font-variation-settings: "wdth" 118; }
html[lang="ar"] .ps b { letter-spacing: 0; line-height: 1.3; }
.ps ul { display: grid; gap: 0; margin-bottom: auto; }
.ps li { padding-block: 11px; border-top: 1px solid var(--line); font-size: 15px; }
.ps.best { background: var(--blue); color: #fff; border-color: var(--blue); }
.ps.best small { color: var(--cyan); }
.ps.best li { border-color: rgba(255, 255, 255, .25); }
.ps .btn { justify-content: center; }
@media (max-width: 900px) { .passes, .films, .eds, .news { grid-template-columns: minmax(0, 1fr); } }

/* Partners */
.part { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: clamp(28px, 5vw, 80px); }
.tier { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 18px; padding-block: 22px; border-top: 1px solid var(--line); }
.tier strong { font-weight: 300; font-size: 34px; line-height: 1; font-variation-settings: "wdth" 120; }
.tier span { font-size: 14px; color: var(--ink2); }
.t-gold strong { color: #B98E4A; } .t-silver strong { color: #7F8CA6; } .t-academic strong { color: var(--blue); }
@media (max-width: 900px) { .part { grid-template-columns: minmax(0, 1fr); } .tier { grid-template-columns: minmax(0, 1fr); gap: 6px; } }

/* Venue + final */
.venue { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 14px; }
.venue .vw { aspect-ratio: 16 / 10; border-radius: 34px; background: var(--ink); }
.venue-c { border-radius: 34px; background: var(--mist); padding: clamp(28px, 4vw, 52px); display: flex; flex-direction: column; justify-content: space-between; gap: 22px; }
@media (max-width: 900px) { .venue { grid-template-columns: minmax(0, 1fr); } }
.final { position: relative; background: var(--blue); color: #fff; overflow: hidden; text-align: center; padding-block: clamp(96px, 12vw, 180px); }
.final .wrap { position: relative; z-index: 1; display: grid; justify-items: center; gap: 26px; }
.final-d { font-weight: 200; font-size: clamp(76px, 15vw, 250px); line-height: .82; letter-spacing: -.05em; font-variation-settings: "wdth" 125; direction: ltr; }
.final .cd > div { background: rgba(255, 255, 255, .14); }
.rings { position: absolute; inset: -40%; background: repeating-radial-gradient(circle at 50% 50%, transparent 0 46px, rgba(255, 255, 255, .07) 47px 48px); animation: rings 20s linear infinite; }
@keyframes rings { to { transform: scale(1.12) rotate(4deg); } }
.ft { background: var(--ink); color: rgba(255, 255, 255, .7); padding-block: 48px 110px; font-size: 14px; }
.ft .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
.ft .logo { color: #fff; }

/* Phone */
.mbar { display: none; }
@media (max-width: 760px) {
  .hero { height: 200svh; }
  .mask-word { font-size: 31vw; }
  .mask { --ox: 74%; }
  .hero-ui { padding-top: 84px; }
  .hero-bot { grid-template-columns: minmax(0, 1fr); }
  .cd > div { min-width: 0; flex: 1; padding-inline: 4px; }
  .cd b { font-size: 26px; }
  .hero-cta .btn { flex: 1; justify-content: center; }
  .hd .btn { display: none; }
  .rail { display: flex !important; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: calc(-1 * var(--pad)); padding-inline: var(--pad); gap: 12px; }
  .rail::-webkit-scrollbar { display: none; }
  .rail > * { flex: 0 0 80%; scroll-snap-align: start; }
  .reels.rail > * { flex-basis: 46%; translate: none !important; }
  .rail + [data-dots] { display: flex; color: var(--blue); }
  .rstats { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .mbar { display: flex; position: fixed; z-index: 60; inset-inline: 10px; bottom: 10px; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 8px 8px 18px; border-radius: 999px;
    background: rgba(6, 16, 51, .9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: #fff; translate: 0 140%; transition: translate .5s var(--ease); }
  [dir="rtl"] .mbar { padding: 8px 18px 8px 8px; }
  .mbar.on { translate: 0 0; }
  .mbar b { font-weight: 400; font-size: 15px; font-variant-numeric: tabular-nums; direction: ltr; }
  .mbar .btn { height: 44px; padding-inline: 20px; }
}
</style>
</head>
<body>
<header class="hd" id="hd"></header>
<main id="app"></main>
<div class="mbar" id="mbar"></div>
<script src="../shared/content.js"></script>
<script src="../shared/dz.js"></script>
<script>
const { C, t, esc, M, D, photo, site, vid } = DZ;
const arrow = '<span class="arr">→</span>';
window.render = () => {
  const u = C.ui, E = C.event;
  document.getElementById("hd").innerHTML = `
    <a class="logo" href="#top">DZAC<b>5</b></a>
    <nav class="nav"><a href="#prog">${t(u.programme)}</a><a href="#mc">${t(u.masterclass)}</a><a href="#fac">${t(u.faculty)}</a><a href="#films">${t(u.films)}</a><a href="#passes">${t(u.passes)}</a><a href="#venue">${t(u.venue)}</a></nav>
    <div class="hd-r"><a href="#" class="lang" data-lang>${t(u.lang)}</a><a class="btn btn-b" href="${site("register")}">${t(u.register)}</a></div>`;
  document.getElementById("mbar").innerHTML = `<b><span data-u="d"></span>d <span data-u="h"></span>:<span data-u="m"></span>:<span data-u="s"></span></b><a class="btn btn-w" href="${site("register")}">${t(u.register)}</a>`;
  const cd = (cls = "") => `<div class="cd ${cls}">${[["d", u.days], ["h", u.hrs], ["m", u.min], ["s", u.sec]].map(([k, l]) => `<div><b data-u="${k}">–</b><small>${t(l)}</small></div>`).join("")}</div>`;
  const introHi = t(C.intro).replace(/(urology|sexual medicine|male infertility|prosthetic surgery|المسالك البولية|الطب الجنسي|عقم الرجال|جراحات الدعامات)/g, "<em>$1</em>");
  document.getElementById("app").innerHTML = `
  <section class="hero" id="top">
    <div class="stage">
      ${vid(D("montage-h.mp4"), D("montage-h.webp"))}
      <div class="mask"><div class="mask-word">DZAC5</div></div>
      <div class="scrim"></div>
      <div class="hero-ui">
        <div class="hero-top"><span class="chip"><i class="dot"></i>${t(E.full)} · ${t(E.edition)}</span><span class="chip">${t(E.date)} · ${t(E.venue)}</span></div>
        <div class="hero-bot">
          <div><p class="tag wide">${t(E.tagline)}</p>
            <div class="hero-cta"><a class="btn btn-b" href="${site("register")}">${t(u.registerNow)} ${arrow}</a><a class="btn btn-o" href="#" data-play-drive="${C.films[0].drive}">▶ ${t(u.watch)}</a></div></div>
          <div><span class="k" style="display:block;margin-bottom:10px">${t(u.opensIn)}</span>${cd()}</div>
        </div>
      </div>
      <div class="film-cap"><p class="big">${t(u.reviewTitle)}</p><span class="k" style="color:var(--cyan)">DZAC 4 · 2026</span></div>
    </div>
  </section>
  <div class="tick"><div class="tick-t">${[0, 1].map(() => `<span>${[...C.tracks.map((x) => t(x.t)), ...C.beyond.map((x) => t(x.t))].map((w) => `${esc(w)}<i></i>`).join("")}</span>`).join("")}</div></div>

  <section class="sec intro"><div class="wrap">
    <span class="k" data-r>${t({ en: "The conference", ar: "المؤتمر" })}</span>
    <p class="big" data-r style="margin-top:22px">${introHi}</p>
    <div class="facts">${C.facts.map((f, i) => `<div class="fact" data-r style="--d:${i}"><b data-count="${f.n}">${f.n}</b><span>${t(f.l)}</span></div>`).join("")}</div>
  </div></section>

  <section class="sec" style="padding-top:0"><div class="wrap">
    <div class="head"><div><span class="k">${t({ en: "New in DZAC 5", ar: "جديد DZAC 5" })}</span><h2 class="big" data-r>${t(u.whatsNew)}</h2></div></div>
    <div class="news rail" data-rail>${C.news.map((n, i) => `<article class="nw" data-n="0${i + 1}" data-r style="--d:${i}"><h3>${t(n.t)}</h3><p>${t(n.b)}</p></article>`).join("")}</div><div data-dots></div>
  </div></section>

  <section class="sec prog" id="prog"><div class="wrap">
    <div class="head"><div><span class="k">${t({ en: "Scientific programme", ar: "البرنامج العلمي" })}</span><h2 class="big" data-r>${t(u.tracks)}</h2></div><p style="max-width:34ch;opacity:.7">${t({ en: "Tap a track to open its sessions.", ar: "اضغط على أي محور لعرض جلساته." })}</p></div>
    <div class="cols" id="cols">${C.tracks.map((tr, i) => `<div class="col${i === 0 ? " on" : ""}" data-i="${i}" role="button" tabindex="0" aria-expanded="${i === 0}">
      <img src="${photo(tr.img)}" alt="" loading="lazy"><span class="col-n">${tr.n}</span>
      <ul class="col-s">${tr.s.map(([title, sp]) => `<li dir="ltr"><span>${esc(title)}</span><small>${esc(sp || t(u.tbc))}</small></li>`).join("")}</ul>
      <span class="col-t">${t(tr.t)}</span></div>`).join("")}</div>
  </div></section>

  <section class="sec beyond"><div class="wrap">
    <div class="head"><div><span class="k">${t({ en: "New in DZAC 5", ar: "جديد DZAC 5" })}</span><h2 class="big" data-r>${t(u.beyond)}</h2></div><p style="max-width:36ch;opacity:.85">${t(C.beyondLine)}</p></div>
    <div class="bw">${C.beyond.map((b, i) => `<a data-r style="--d:${i}"><strong>${t(b.t)}</strong><span>${t(b.b)}</span></a>`).join("")}</div>
  </div></section>

  <section class="sec" id="mc"><div class="wrap mc">
    <div class="mc-v" data-r>${vid(D("v-m2-or.mp4"), D("v-m2-or.webp"))}<span class="live"><i></i>LIVE · OR 1</span></div>
    <div>
      <span class="k" data-r>${t(C.mc.kicker)}</span>
      <h2 class="big" data-r style="margin-top:16px;font-size:clamp(40px,5vw,80px)">${t(C.mc.title)}</h2>
      <div class="mc-20" data-r><b data-count="20">20</b><span>${t(C.mc.live)}</span></div>
      <ul>${C.mc.points.map((p) => `<li data-r>${t(p)}</li>`).join("")}</ul>
      <div class="fee" data-r><div><small>${t(u.fee)} · ${t(C.mc.feeNote)}</small><b dir="ltr">${C.mc.fee}</b></div><a class="btn btn-b" href="${site("apply")}?intent=masterclass">${t(u.seat)} ${arrow}</a></div>
    </div>
  </div></section>

  <section class="review">
    ${vid(M("media/loops/review.mp4"), M("media/loops/review.webp"))}
    <div class="wrap"><span class="k">${t(u.review)}</span><h2 class="big" style="max-width:14ch;margin-top:14px" data-r>${t(u.reviewTitle)}</h2>
      <div class="rstats">${[["8–9 Jan 2026", { en: "Two conference days", ar: "يوما المؤتمر" }], ["2", { en: "Venues: hotel and urology hospital", ar: "مقرّان: الفندق ومستشفى المسالك" }], ["4th", { en: "Edition", ar: "النسخة" }]].map(([v, l]) => `<div data-r><b dir="ltr">${v}</b><span>${t(l)}</span></div>`).join("")}</div></div>
  </section>

  <section class="sec"><div class="wrap">
    <div class="head"><div><span class="k">${t({ en: "Since the first edition", ar: "منذ النسخة الأولى" })}</span><h2 class="big" data-r>${t(u.editions)}</h2></div></div>
    <div class="eds rail" data-rail>${C.editions.map((e, i) => `<div class="ed${i === 4 ? " now" : ""}" data-r style="--d:${i}"><b>${e.n}</b><small>${t(e.w)}</small><strong>${t(e.p)}</strong><span>${t(e.x)}</span></div>`).join("")}</div><div data-dots></div>
  </div></section>

  <section class="sec lounge"><div class="wrap">
    <div class="head"><div><span class="k" dir="ltr">Men’s Lounge Talks</span><h2 class="big" data-r>${t({ en: "Voices of DZAC", ar: "أصوات DZAC" })}</h2></div><p style="max-width:36ch;color:var(--ink2)">${t(u.loungeBody)}</p></div>
    <div class="reels rail" data-rail>${C.lounge.map((id, i) => `<a class="reel" href="#" data-play-drive="${id}" data-vertical="1" data-r style="--d:${i}">${vid(M(`media/loops/lounge-${i + 1}.mp4`), M(`media/loops/lounge-${i + 1}.webp`))}<span class="ep">EP ${String(i + 1).padStart(2, "0")}</span><span class="play">▶</span></a>`).join("")}</div><div data-dots></div>
  </div></section>

  <section class="sec" id="fac"><div class="wrap">
    <div class="head"><div><span class="k">${t(u.faculty)}</span><h2 class="big" data-r>${t(u.leadership)}</h2></div></div>
    <div class="fac rail" data-rail>${C.leaders.map((l, i) => `<div class="pr" data-r style="--d:${i}"><div class="pr-ph">${l.img ? `<img src="${photo(l.img)}" alt="${esc(t(l.n))}" loading="lazy">` : `<span class="pr-in">${l.n.en.replace(/^(Prof\. Dr\.|Prof\.|Dr\.)\s*/, "").split(/\s+/).slice(0, 2).map((w) => w[0]).join("")}</span>`}</div><small>${t(l.r)}</small><strong>${t(l.n)}</strong></div>`).join("")}</div><div data-dots></div>
    <div class="orgs">${C.orgs.map((o) => `<div data-r><small>${t(o.r)}</small><strong style="font-weight:400">${t(o.n)}</strong></div>`).join("")}</div>
    <div class="past" data-r><em>${t(u.pastFaculty)}</em>${C.past.map((p) => `<span>${p}</span>`).join("")}</div>
  </div></section>

  <section class="sec" id="films" style="padding-top:0"><div class="wrap">
    <div class="head"><div><span class="k">${t(u.films)}</span><h2 class="big" data-r>${t({ en: "On screen", ar: "على الشاشة" })}</h2></div></div>
    <div class="films rail" data-rail>${C.films.map((f, i) => `<a class="fl" href="#" ${f.file ? `data-play-file="${M(f.file)}"` : `data-play-drive="${f.drive}"`} data-r style="--d:${i}"><div class="vw">${vid(M(`media/loops/film-${f.key}.mp4`), M(`media/loops/film-${f.key}.webp`))}</div><small>${t(f.k)}</small><strong>${t(f.t)}</strong></a>`).join("")}</div><div data-dots></div>
  </div></section>

  <section class="sec" id="passes" style="background:var(--mist)"><div class="wrap">
    <div class="head"><div><span class="k">${t({ en: "Registration", ar: "التسجيل" })}</span><h2 class="big" data-r>${t({ en: "Pick your pass", ar: "اختر تذكرتك" })}</h2></div><a class="btn btn-o" style="color:var(--blue)" href="${site("apply")}"><span>${t(u.findPass)}</span></a></div>
    <div class="passes rail" data-rail>${C.passes.map((p, i) => `<div class="ps${p.best ? " best" : ""}" data-r style="--d:${i}"><small>${t(p.n)}${p.best ? " · " + t({ en: "Best value", ar: "الأفضل قيمة" }) : ""}</small><b dir="${p.id === "masterclass" ? "ltr" : "auto"}">${t(p.id === "bundle" ? p.x : p.p)}</b><ul>${p.i.map((x) => `<li>${t(x)}</li>`).join("")}</ul><a class="btn ${p.best ? "btn-w" : "btn-b"}" href="${site("register")}?pass=${p.id}">${t(u.choose)} ${arrow}</a></div>`).join("")}</div><div data-dots></div>
  </div></section>

  <section class="sec"><div class="wrap part">
    <div data-r><span class="k">${t(u.partners)}</span><h2 class="big" style="margin-block:16px 18px">${t({ en: "Partner with DZAC 5", ar: "شارك مع DZAC 5" })}</h2><p style="color:var(--ink2);max-width:40ch;margin-bottom:24px">${t(C.partnersFor)}</p><a class="btn btn-b" href="${site("apply")}?intent=partner">${t(u.becomePartner)} ${arrow}</a></div>
    <div>${C.tiers.map((x) => `<div class="tier t-${x.id}" data-r><strong>${t(x.n)}</strong><span>${t(x.i)}</span></div>`).join("")}</div>
  </div></section>

  <section class="sec" id="venue" style="padding-top:0"><div class="wrap venue">
    <div class="vw" data-r>${vid(M("media/loops/venue.mp4"), M("media/loops/venue.webp"))}</div>
    <div class="venue-c" data-r><div><span class="k">${t(u.venue)}</span><h2 class="big" style="margin-top:14px;font-size:clamp(38px,4.4vw,68px)">${t(E.venueName)}</h2><p style="color:var(--ink2);margin-top:12px">${t(E.city)} · ${t(E.date)}</p></div><a class="btn btn-b" style="align-self:flex-start" href="${E.maps}" target="_blank" rel="noreferrer">${t(u.directions)} ↗</a></div>
  </div></section>

  <section class="final"><div class="rings"></div><div class="wrap">
    <span class="k" style="color:var(--cyan)">${t(E.tagline)}</span>
    <div class="final-d" data-r>14.01.27</div>
    ${cd()}
    <div class="hero-cta" style="justify-content:center"><a class="btn btn-w" href="${site("register")}">${t(u.registerNow)} ${arrow}</a><a class="btn btn-o" href="${site("apply")}"><span>${t(u.findPass)}</span></a></div>
  </div></section>
  <footer class="ft"><div class="wrap"><a class="logo" href="#top">DZAC<b>5</b></a><span>${t(E.full)} · ${t(E.date)} · ${t(E.venue)}</span><span>Dar El Zokora · ISMHA · Horizon</span></div></footer>`;

  /* Track columns: one open at a time */
  const cols = document.getElementById("cols");
  const open = (el) => { cols.querySelectorAll(".col").forEach((c) => { c.classList.toggle("on", c === el); c.setAttribute("aria-expanded", c === el); }); };
  cols.querySelectorAll(".col").forEach((c) => { c.addEventListener("click", () => open(c)); c.addEventListener("keydown", (e) => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), open(c))); if (matchMedia("(hover: hover)").matches) c.addEventListener("mouseenter", () => open(c)); });
};

/* The hero flight and the header/phone bar, driven by one scroll handler */
(() => {
  let raf = 0;
  const on = () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const hero = document.querySelector(".hero");
      if (hero) {
        const r = hero.getBoundingClientRect();
        const p = Math.min(1, Math.max(0, -r.top / (r.height - innerHeight)));
        hero.style.setProperty("--p", matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : p.toFixed(4));
      }
      document.getElementById("hd").classList.toggle("solid", scrollY > 30);
      document.getElementById("mbar").classList.toggle("on", scrollY > innerHeight * 1.6);
    });
  };
  addEventListener("scroll", on, { passive: true });
  addEventListener("resize", on);
  document.addEventListener("DOMContentLoaded", on);
})();
</script>
</body>
</html>
